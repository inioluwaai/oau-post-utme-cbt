<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAU Post-UTME CBT</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#182230}header{background:#071f45;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}.timer{font-weight:900;font-size:22px;color:#f4c542}.wrap{max-width:1050px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 3px 15px #0001;margin-bottom:16px}button{padding:11px 15px;border:0;border-radius:9px;background:#071f45;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.q{font-size:19px;line-height:1.5;margin:18px 0}.opt{display:block;width:100%;text-align:left;border:1px solid #d0d5dd;background:#fff;color:#182230;padding:13px;border-radius:9px;margin:9px 0}.opt.sel{border:2px solid #0d3267;background:#edf3ff}.nav{display:flex;justify-content:space-between;margin-top:18px;gap:8px}.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.num{padding:8px;background:#eef2f6;color:#344054}.answered{background:#d1fadf}.current{outline:3px solid #98a2b3}.flagged{box-shadow:inset 0 -3px #f4c542}.results{font-size:18px}.score{font-size:48px;font-weight:900;color:#071f45}.bar{height:10px;background:#eaecf0;border-radius:8px;overflow:hidden}.fill{height:100%;background:#d9a900}.muted{color:#667085}.danger{background:#b42318}.status{padding:10px 12px;border-radius:8px;background:#eef6ff;margin:12px 0}.hidden{display:none}.calc-back{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20}.calc{width:min(360px,92vw);background:#fff;border-radius:16px;padding:16px;box-shadow:0 15px 50px #0006}.calc-display{width:100%;box-sizing:border-box;padding:14px;font-size:24px;text-align:right;border:1px solid #d0d5dd;border-radius:10px;margin-bottom:10px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc-grid button{padding:14px 8px;font-size:16px}.calc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}@media(max-width:800px){.palette{grid-template-columns:repeat(5,1fr)}}</style><script src="./oau-bank.js"></script></head><body><header><b>OAU POST-UTME CBT</b><span id="clock" class="timer">--:--</span></header><div class="wrap" id="app"></div><script>const EMBEDDED_BANK={"version": "2.0", "description": "Embedded OAU-style practice bank; online bank can be merged when available.", "questions": [{"id": "eng1", "subject": "English", "topic": "Vocabulary", "sourceYear": "OAU-style practice", "question": "Choose the word nearest in meaning to 'meticulous'.", "options": ["Careless", "Thorough", "Rapid", "Noisy"], "answer": 1}, {"id": "eng2", "subject": "English", "topic": "Concord", "sourceYear": "OAU-style practice", "question": "Neither the teacher nor the students ___ aware of the change.", "options": ["was", "were", "is", "has"], "answer": 1}, {"id": "eng3", "subject": "English", "topic": "Vocabulary", "sourceYear": "OAU-style practice", "question": "Choose the word opposite in meaning to 'scarce'.", "options": ["Rare", "Abundant", "Small", "Limited"], "answer": 1}, {"id": "eng4", "subject": "English", "topic": "Grammar", "sourceYear": "OAU-style practice", "question": "If I had known, I ___.", "options": ["will come", "would come", "would have come", "came"], "answer": 2}, {"id": "eng5", "subject": "English", "topic": "Idioms", "sourceYear": "OAU-style practice", "question": "To 'hit the nail on the head' means to", "options": ["miss an opportunity", "say exactly the right thing", "work carelessly", "become angry"], "answer": 1}, {"id": "eng6", "subject": "English", "topic": "Figures of Speech", "sourceYear": "OAU-style practice", "question": "'The wind whispered through the trees' contains", "options": ["simile", "personification", "hyperbole", "irony"], "answer": 1}, {"id": "eng7", "subject": "English", "topic": "Grammar", "sourceYear": "OAU-style practice", "question": "She is one of the students who ___ always punctual.", "options": ["is", "are", "was", "has"], "answer": 1}, {"id": "eng8", "subject": "English", "topic": "Vocabulary", "sourceYear": "OAU-style practice", "question": "'Reluctant' most nearly means", "options": ["unwilling", "eager", "certain", "careless"], "answer": 0}, {"id": "eng9", "subject": "English", "topic": "Grammar", "sourceYear": "OAU-style practice", "question": "By this time tomorrow, we ___ the examination.", "options": ["finish", "finished", "will have finished", "have finished"], "answer": 2}, {"id": "eng10", "subject": "English", "topic": "Grammar", "sourceYear": "OAU-style practice", "question": "Each of the boys ___ a book.", "options": ["have", "has", "are having", "were"], "answer": 1}, {"id": "math1", "subject": "Mathematics", "topic": "Algebra", "sourceYear": "OAU-style practice", "question": "Solve: 3x + 5 = 20.", "options": ["3", "5", "7", "8"], "answer": 1}, {"id": "math2", "subject": "Mathematics", "topic": "Probability", "sourceYear": "OAU-style practice", "question": "A fair die is thrown. Probability of getting an even number?", "options": ["1/6", "1/3", "1/2", "2/3"], "answer": 2}, {"id": "math3", "subject": "Mathematics", "topic": "Logarithms", "sourceYear": "OAU-style practice", "question": "If log₁₀x = 3, x equals", "options": ["30", "100", "1000", "3000"], "answer": 2}, {"id": "math4", "subject": "Mathematics", "topic": "Indices", "sourceYear": "OAU-style practice", "question": "Simplify 2³ × 2⁴.", "options": ["2⁷", "2¹²", "4⁷", "8⁴"], "answer": 0}, {"id": "math5", "subject": "Mathematics", "topic": "Mensuration", "sourceYear": "OAU-style practice", "question": "Area of a rectangle 8 cm by 5 cm is", "options": ["13 cm²", "26 cm²", "40 cm²", "80 cm²"], "answer": 2}, {"id": "math6", "subject": "Mathematics", "topic": "Percentages", "sourceYear": "OAU-style practice", "question": "An item bought for ₦12,000 is sold for ₦15,000. Percentage profit?", "options": ["20%", "25%", "30%", "35%"], "answer": 1}, {"id": "math7", "subject": "Mathematics", "topic": "Sequence", "sourceYear": "OAU-style practice", "question": "The next term in 2, 5, 8, 11 is", "options": ["12", "13", "14", "15"], "answer": 2}, {"id": "math8", "subject": "Mathematics", "topic": "Integration", "sourceYear": "OAU-style practice", "question": "∫2x dx equals", "options": ["2x²+C", "x²+C", "x+C", "2+C"], "answer": 1}, {"id": "math9", "subject": "Mathematics", "topic": "Variation", "sourceYear": "OAU-style practice", "question": "If y varies directly as x and y=12 when x=3, y when x=5 is", "options": ["15", "20", "24", "60"], "answer": 1}, {"id": "math10", "subject": "Mathematics", "topic": "Bearing", "sourceYear": "OAU-style practice", "question": "A bearing is measured clockwise from", "options": ["South", "East", "North", "West"], "answer": 2}, {"id": "phy1", "subject": "Physics", "topic": "Kinematics", "sourceYear": "OAU-style practice", "question": "A car starts from rest and accelerates at 4 m/s² for 5 s. Final velocity?", "options": ["9 m/s", "20 m/s", "25 m/s", "40 m/s"], "answer": 1}, {"id": "phy2", "subject": "Physics", "topic": "Forces", "sourceYear": "OAU-style practice", "question": "Newton's second law is represented by", "options": ["F=mv", "F=ma", "F=m/a", "F=a/m"], "answer": 1}, {"id": "phy3", "subject": "Physics", "topic": "Work", "sourceYear": "OAU-style practice", "question": "Work done by a 10 N force moving an object 5 m in its direction is", "options": ["2 J", "15 J", "50 J", "100 J"], "answer": 2}, {"id": "phy4", "subject": "Physics", "topic": "Power", "sourceYear": "OAU-style practice", "question": "A machine does 600 J of work in 20 s. Power?", "options": ["20 W", "30 W", "60 W", "120 W"], "answer": 1}, {"id": "phy5", "subject": "Physics", "topic": "Waves", "sourceYear": "OAU-style practice", "question": "If frequency is 5 Hz and wavelength is 2 m, wave speed is", "options": ["2.5 m/s", "7 m/s", "10 m/s", "25 m/s"], "answer": 2}, {"id": "phy6", "subject": "Physics", "topic": "Electricity", "sourceYear": "OAU-style practice", "question": "A 12 V supply across a 4 Ω resistor gives current", "options": ["0.3 A", "3 A", "8 A", "48 A"], "answer": 1}, {"id": "phy7", "subject": "Physics", "topic": "Momentum", "sourceYear": "OAU-style practice", "question": "A 2 kg object moves at 5 m/s. Momentum?", "options": ["2.5 kg m/s", "7 kg m/s", "10 kg m/s", "25 kg m/s"], "answer": 2}, {"id": "phy8", "subject": "Physics", "topic": "Heat", "sourceYear": "OAU-style practice", "question": "Heat for a temperature change is calculated using", "options": ["Q=mL", "Q=mcΔT", "Q=mv", "Q=Pt"], "answer": 1}, {"id": "phy9", "subject": "Physics", "topic": "Optics", "sourceYear": "OAU-style practice", "question": "The image formed by a plane mirror is", "options": ["real and inverted", "virtual and upright", "real and upright", "virtual and inverted"], "answer": 1}, {"id": "phy10", "subject": "Physics", "topic": "Dimensions", "sourceYear": "OAU-style practice", "question": "The SI unit of electric current is", "options": ["volt", "ohm", "ampere", "coulomb"], "answer": 2}, {"id": "chem1", "subject": "Chemistry", "topic": "Mole Concept", "sourceYear": "OAU-style practice", "question": "How many moles are present in 18 g of water? (H₂O = 18 g/mol)", "options": ["0.1 mol", "1 mol", "18 mol", "36 mol"], "answer": 1}, {"id": "chem2", "subject": "Chemistry", "topic": "Bonding", "sourceYear": "OAU-style practice", "question": "A bond formed by transfer of electrons is", "options": ["covalent", "ionic", "metallic", "hydrogen"], "answer": 1}, {"id": "chem3", "subject": "Chemistry", "topic": "Organic Chemistry", "sourceYear": "OAU-style practice", "question": "The functional group in alcohols is", "options": ["-COOH", "-OH", "-CHO", "-CO-"], "answer": 1}, {"id": "chem4", "subject": "Chemistry", "topic": "Gas Laws", "sourceYear": "OAU-style practice", "question": "At constant temperature, pressure is inversely proportional to volume. This is", "options": ["Charles' law", "Boyle's law", "Avogadro's law", "Faraday's law"], "answer": 1}, {"id": "chem5", "subject": "Chemistry", "topic": "Separation", "sourceYear": "OAU-style practice", "question": "Filtration separates a", "options": ["soluble solid from liquid", "insoluble solid from liquid", "liquid from liquid only", "gas from gas"], "answer": 1}, {"id": "chem6", "subject": "Chemistry", "topic": "Acids", "sourceYear": "OAU-style practice", "question": "A solution with pH 2 is", "options": ["strongly acidic", "neutral", "weakly alkaline", "strongly alkaline"], "answer": 0}, {"id": "chem7", "subject": "Chemistry", "topic": "Atomic Structure", "sourceYear": "OAU-style practice", "question": "The number of protons in a neutral atom equals its", "options": ["mass number", "atomic number", "neutron number", "nucleon number"], "answer": 1}, {"id": "chem8", "subject": "Chemistry", "topic": "Electrolysis", "sourceYear": "OAU-style practice", "question": "During electrolysis, reduction occurs at the", "options": ["anode", "cathode", "electrolyte only", "salt bridge"], "answer": 1}, {"id": "chem9", "subject": "Chemistry", "topic": "Stoichiometry", "sourceYear": "OAU-style practice", "question": "The molar mass of CO₂ is approximately", "options": ["28", "32", "44", "46"], "answer": 2}, {"id": "chem10", "subject": "Chemistry", "topic": "Redox", "sourceYear": "OAU-style practice", "question": "Oxidation can be defined as", "options": ["gain of electrons", "loss of electrons", "gain of neutrons", "loss of protons"], "answer": 1}]};const BANK_URL='./oau-questions.json';const DURATION=40*60,MARK=2.5;
const COMBOS={"Engineering / Physical Sciences":["English","Mathematics","Physics","Chemistry"],"Health / Medical Sciences":["English","Mathematics","Physics","Chemistry"]};
let S={name:"",subjects:[],qs:[],ans:[],flag:[],i:0,left:DURATION,timer:null,done:false};const app=document.getElementById("app");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const tm=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")+":"+String(Math.max(0,s)%60).padStart(2,"0");
function setup(){clearInterval(S.timer);document.getElementById("clock").textContent="--:--";app.innerHTML=`<div class="card"><h1>OAU Post-UTME CBT</h1><p class="muted">40 questions • 4 subjects • 40 minutes • 100 marks.</p><div class="status">🟢 Question bank ready — you can start immediately. Online sync is optional and never blocks the test.</div><label>Name</label><input id="name" style="width:100%;padding:12px;box-sizing:border-box" placeholder="Enter your name"><br><br><label>Course / subject combination</label><select id="course" style="width:100%;padding:12px">${Object.keys(COMBOS).map(x=>`<option>${x}</option>`).join("")}</select><p id="combo" class="muted"></p><button id="start" type="button" onclick="start()">Start CBT</button><button id="refresh" type="button" style="margin-left:8px;background:#667085">Sync online bank</button><div id="online" class="muted"></div></div>`;const c=document.getElementById("course");const hint=()=>document.getElementById("combo").textContent="Subjects: "+COMBOS[c.value].join(" • ");c.onchange=hint;hint();document.getElementById("refresh").onclick=refreshOnline}
function build(bank){let all=[];for(const sub of S.subjects){let pool=bank.filter(q=>q.subject?.toLowerCase()===sub.toLowerCase()&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4);if(pool.length<10)throw Error(`Need 10 valid ${sub} questions; found ${pool.length}.`);all.push(...shuffle(pool).slice(0,10).map(q=>{let right=q.options[q.answer],opts=shuffle(q.options);return {...q,options:opts,answer:opts.indexOf(right)}}))}S.qs=shuffle(all);S.ans=Array(40).fill(null);S.flag=Array(40).fill(false);S.i=0}
function start(){try{const nameEl=document.getElementById("name"),courseEl=document.getElementById("course");S.name=(nameEl?.value||"").trim();if(!S.name){alert("Enter your name first.");nameEl?.focus();return}S.subjects=COMBOS[courseEl?.value]||COMBOS[Object.keys(COMBOS)[0]];const bank=(window.ONLINE_BANK&&window.ONLINE_BANK.length)?window.ONLINE_BANK:EMBEDDED_BANK.questions;build(bank);S.left=DURATION;S.done=false;render();clock()}catch(e){console.error(e);try{S.subjects=COMBOS[document.getElementById("course")?.value]||Object.values(COMBOS)[0];build(EMBEDDED_BANK.questions);S.left=DURATION;S.done=false;render();clock()}catch(e2){alert("CBT could not start: "+e2.message)}}}
async function refreshOnline(){const el=document.getElementById("online");el.textContent="Checking online bank…";const localBank=window.ONLINE_BANK_DATA?.questions||[];try{const r=await fetch(BANK_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();if(!Array.isArray(d.questions))throw Error("Invalid JSON bank");const valid=d.questions.filter(q=>q&&q.subject&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4);if(valid.length<40)throw Error("JSON bank has only "+valid.length+" valid questions; 40 minimum.");window.ONLINE_BANK=valid;el.innerHTML="🟢 Live JSON bank loaded — "+valid.length+" questions. Start CBT will use it.";document.getElementById("refresh").textContent="Reload bank";return}catch(e){console.warn("Remote JSON unavailable:",e)}if(localBank.length>=40){window.ONLINE_BANK=localBank.filter(q=>q&&q.subject&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4);el.innerHTML="🟢 Bank loaded locally — "+window.ONLINE_BANK.length+" questions. The JSON file is also kept beside this app and will be used automatically when served online.";document.getElementById("refresh").textContent="Reload bank";return}window.ONLINE_BANK=EMBEDDED_BANK.questions;el.innerHTML="🟡 Online JSON unavailable in this environment. Using the built-in bank ("+window.ONLINE_BANK.length+" questions) so the CBT remains fully usable.";document.getElementById("refresh").textContent="Try online bank again"}
function useCalculator(){if(document.getElementById("calcBack"))return;const back=document.createElement("div");back.id="calcBack";back.className="calc-back";back.innerHTML='<div class="calc"><div class="calc-top"><b>Calculator</b><button id="calcClose" style="background:#667085">Close</button></div><input id="calcDisplay" class="calc-display" value="0" readonly><div class="calc-grid">'+['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','%','+','√','x²','Ans','='].map(x=>'<button data-c="'+x+'">'+x+'</button>').join('')+'</div></div>';document.body.appendChild(back);let expr="",ans="";const d=document.getElementById("calcDisplay");const show=()=>d.value=expr||"0";back.querySelectorAll("[data-c]").forEach(btn=>btn.onclick=()=>{const k=btn.dataset.c;if(k==="C")expr="";else if(k==="⌫")expr=expr.slice(0,-1);else if(k==="Ans")expr+=ans||"0";else if(k==="√")expr="Math.sqrt("+expr+")";else if(k==="x²")expr="("+expr+")**2";else if(k==="÷")expr+=" / ";else if(k==="×")expr+=" * ";else if(k==="−")expr+=" - ";else if(k==="="){try{if(!/^[0-9+\-*/().%\sMathsqrt]*$/.test(expr))throw 0;let v=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(v))throw 0;ans=String(v);expr=ans}catch{d.value="Error";expr=""}}else expr+=k;show()});document.getElementById("calcClose").onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()}}
function clock(){clearInterval(S.timer);const tick=()=>{const c=document.getElementById("clock");if(c)c.textContent=tm(S.left);if(S.left<=0)submit(true)};tick();S.timer=setInterval(()=>{S.left--;tick()},1000)}
function render(){const q=S.qs[S.i];app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(S.name)}</b><div class="muted">${esc(q.subject)} • ${esc(q.topic||"General")} • ${esc(q.sourceYear||"Practice")}</div></div><b>${S.i+1}/40</b></div><div class="bar"><div class="fill" style="width:${(S.i+1)/40*100}%"></div></div><div class="q">${esc(q.question)}</div><div>${q.options.map((o,k)=>`<button class="opt ${S.ans[S.i]===k?"sel":""}" data-k="${k}">${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join("")}</div><div class="nav"><button id="prev">← Previous</button><button id="next">${S.i===39?"Review →":"Next →"}</button></div><div style="display:flex;gap:8px;margin-top:12px"><button id="calculator" style="background:#667085">🧮 Calculator</button></div></div><div class="card"><div style="display:flex;justify-content:space-between"><b>Question navigator</b><button id="flag">${S.flag[S.i]?"⚑ Unflag":"⚐ Flag"}</button></div><div class="palette">${S.qs.map((_,k)=>`<button class="num ${S.ans[k]!==null?"answered":""} ${k===S.i?"current":""} ${S.flag[k]?"flagged":""}" data-n="${k}">${k+1}</button>`).join("")}</div><button type="button" id="submit" class="danger" style="width:100%;margin-top:15px">Submit Test</button></div>`;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.k;render()});document.getElementById("prev").onclick=()=>{if(S.i){S.i--;render()}};document.getElementById("next").onclick=()=>S.i<39?(S.i++,render()):confirmSubmit();document.getElementById("flag").onclick=()=>{S.flag[S.i]=!S.flag[S.i];render()};document.getElementById("calculator").onclick=useCalculator;document.getElementById("submit").onclick=confirmSubmit;document.querySelectorAll(".num").forEach(b=>b.onclick=()=>{S.i=+b.dataset.n;render()})}
function confirmSubmit(){let u=S.ans.filter(x=>x===null).length;if(confirm(`Answered: ${40-u}/40\\nUnanswered: ${u}\\n\\nSubmit test?`))submit(false)}
function submit(auto){if(S.done||!S.qs.length)return;S.done=true;clearInterval(S.timer);let correct=0,by={};S.qs.forEach((q,i)=>{by[q.subject]??={c:0};if(S.ans[i]===q.answer){correct++;by[q.subject].c++}});let score=correct*MARK,spent=DURATION-S.left;app.innerHTML=`<div class="card results"><h1>Test Complete</h1><div class="score">${score}/100</div><p>${correct}/40 correct • ${tm(spent)} spent${auto?" • Time expired":""}</p></div><div class="card"><h2>Subject Breakdown</h2>${S.subjects.map(s=>`<p><b>${esc(s)}</b>: ${(by[s]?.c||0)*MARK}/25 (${by[s]?.c||0}/10)</p>`).join("")}</div><div class="card"><h2>Answer Review</h2>${S.qs.map((q,i)=>{let ok=S.ans[i]===q.answer,ua=S.ans[i]===null?"Not answered":q.options[S.ans[i]];return `<div style="padding:13px;border-bottom:1px solid #eee;border-left:4px solid ${ok?"#16834b":"#c73545"}"><b>${i+1}. ${esc(q.question)}</b><p class="muted">Your answer: ${esc(ua)}<br>Correct answer: ${esc(q.options[q.answer])}</p></div>`}).join("")}</div><div class="nav"><button id="again">New Random Test</button></div>`;document.getElementById("again").onclick=setup}
window.ONLINE_BANK=EMBEDDED_BANK.questions;setup();</script></body></html>
